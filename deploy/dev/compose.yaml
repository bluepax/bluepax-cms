# Development database only. Production compose lives in deploy/ (see docs/spec/README.md chapter 9).
#   docker compose -f deploy/dev/compose.yaml up -d
name: bluepax-cms-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bluepax
      POSTGRES_PASSWORD: bluepax
      POSTGRES_DB: bluepax
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bluepax]
      interval: 2s
      retries: 30

volumes:
  pgdata:
