# OpenResty (or nginx) in front of BluePax CMS, see deploy/README.md ("Gateway") and
# docs/spec/README.md chapter 9. HTTPS ends here. Put this file in the http {} context, e.g.
# /etc/openresty/conf.d/bluepax-cms.conf, and set in deploy/.env:
#   ORIGIN=https://cms.example.com
#   ADDRESS_HEADER=X-Forwarded-For
#   XFF_DEPTH=1

server {
    listen 80;
    listen [::]:80;
    server_name cms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.example.com;

    ssl_certificate     /etc/ssl/cms.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/cms.example.com/privkey.pem;

    # Uploads up to the CMS's BODY_SIZE_LIMIT (nginx allows 1 MB by default), streamed to the
    # CMS instead of buffered to disk; sharp may take a while for large images.
    client_max_body_size 256m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Behind Cloudflare's proxy (orange cloud): take the visitor from CF-Connecting-IP, but only
    # for requests from Cloudflare's addresses (one line per range from
    # https://www.cloudflare.com/ips/).
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 2400:cb00::/32;
    # real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Exactly one address, the visitor as this gateway sees it: never append to the value a
        # client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The CMS already sends `X-Robots-Tag: noindex` on every response, media files included,
    # and serves a robots.txt that disallows everything. Do not block AI crawlers here: that is
    # up to the frontend sites.
}
