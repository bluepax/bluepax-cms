# Builds the image from deploy/Dockerfile for linux/amd64 and linux/arm64 and pushes it to GHCR,
# see docs/spec/README.md chapter 11 ("镜像标签") and docs/adr/0015. Called by ci.yml (`edge`,
# after every push to dev that passed CI) and release.yml (version tags). Only the workflow's
# own GITHUB_TOKEN is used. The org.opencontainers.image.source label links the package to
# this repository.
name: image

on:
  workflow_call:
    inputs:
      tags:
        description: Image tags separated by spaces, e.g. "edge" or "1.0.0-beta.12 beta"
        type: string
        required: true
      version:
        description: Version shown on the About page and by GET /api/health
        type: string
        required: true
      build:
        description: Build number; when empty, the first-parent commit count of the checkout
        type: string
        default: ''
    outputs:
      digest:
        description: Digest of the pushed multi-platform image (sha256:…)
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/bluepax/bluepax-cms
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the first-parent commit count of dev.
          fetch-depth: 0
      - name: build information and tags
        id: info
        env:
          BUILD: ${{ inputs.build }}
          TAGS: ${{ inputs.tags }}
        run: |
          if [ -z "$BUILD" ]; then BUILD=$(git rev-list --count --first-parent HEAD); fi
          {
            echo "build=$BUILD"
            echo "commit=$(git rev-parse HEAD)"
            echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'tags<<EOF'
            for tag in $TAGS; do echo "$IMAGE:$tag"; done
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.info.outputs.tags }}
          build-args: |
            BLUEPAX_VERSION=${{ inputs.version }}
            BLUEPAX_BUILD=${{ steps.info.outputs.build }}
            BLUEPAX_COMMIT=${{ steps.info.outputs.commit }}
            BLUEPAX_BUILT_AT=${{ steps.info.outputs.built-at }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.info.outputs.commit }}
            org.opencontainers.image.created=${{ steps.info.outputs.built-at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: summary
        env:
          TAGS: ${{ steps.info.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '### Image'
            echo
            for tag in $TAGS; do echo "- \`$tag\`"; done
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
