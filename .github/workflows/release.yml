name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: check tag
        run: |
          TAG="$GITHUB_REF_NAME"
          # Bluepax Flow: vX.Y.Z, or vX.0.0-beta.N for a new major version only
          echo "$TAG" | grep -Eq '^v[1-9][0-9]*\.(0\.0-beta\.[1-9][0-9]*|(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$' \
            || { echo "::error::tag $TAG does not follow Bluepax Flow"; exit 1; }
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "$TAG")" = tag ] \
            || { echo "::error::tag $TAG must be annotated"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $TAG is not on main"; exit 1; }

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          NOTE="$(git tag -l --format='%(contents:subject)' "$TAG")"
          git log -1 --format=%b "$GITHUB_SHA" > notes.md
          FLAGS=""
          case "$TAG" in *-beta.*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG $NOTE" --notes-file notes.md $FLAGS
