# Release pipeline, see docs/spec/README.md chapter 11 ("发布流程").
# Triggered by an annotated tag vX.Y.Z or vX.0.0-beta.N on main. No token is stored in the
# repository: the image and the GitHub Release use the workflow's own GITHUB_TOKEN, the npm packages
# go to npmjs through npm trusted publishing (GitHub OIDC) with provenance (docs/adr/0017). The
# trusted publisher configured on npmjs names this file, so renaming it breaks npm publishing.
# Any failed step stops the pipeline before the GitHub Release is created; re-running the
# workflow for the same tag skips npm versions that were already published.
# The image goes to GHCR as ghcr.io/bluepax/bluepax-cms with the tags of chapter 11; its digest
# is written into the release notes (docs/adr/0015).
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      dist-tag: ${{ steps.info.outputs.dist-tag }}
      build: ${{ steps.info.outputs.build }}
      codename: ${{ steps.info.outputs.codename }}
      image-tags: ${{ steps.info.outputs.image-tags }}
      json: ${{ steps.info.outputs.json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: fetch the annotated tag and main
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git fetch origin main
      - name: check the tag against BluePax Flow
        id: info
        run: node scripts/release/info.ts "$GITHUB_REF_NAME"

  ci:
    needs: verify
    # ci.yml's `edge` job (skipped for tags) asks for packages: write, so the call must allow it.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml

  image:
    needs: [verify, ci]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tags: ${{ needs.verify.outputs.image-tags }}
      version: ${{ needs.verify.outputs.version }}
      build: ${{ needs.verify.outputs.build }}

  npm:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    # id-token: write lets npm exchange this job's OIDC token for a publish credential (trusted
    # publishing) and sign provenance. The job must stay in this file, not in a called workflow.
    permissions:
      contents: read
      id-token: write
    outputs:
      packages: ${{ steps.publish.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: write the release version into the workspace packages
        run: node scripts/release/npm.ts set-version "${{ needs.verify.outputs.version }}"
      - name: build
        run: pnpm -r --if-present build
      - name: pack
        run: node scripts/release/npm.ts pack dist-npm
      - name: publish to npmjs
        id: publish
        run: node scripts/release/npm.ts publish "${{ needs.verify.outputs.dist-tag }}" dist-npm

  release:
    needs: [verify, npm, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: fetch the annotated tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: write the release notes
        env:
          RELEASE_INFO: ${{ needs.verify.outputs.json }}
          PUBLISHED_PACKAGES: ${{ needs.npm.outputs.packages }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: node scripts/release/notes.ts release-notes.md
      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          CODENAME: ${{ needs.verify.outputs.codename }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then FLAG=--prerelease; else FLAG=--latest; fi
          gh release create "$TAG" --verify-tag --title "$TAG ($CODENAME)" \
            --notes-file release-notes.md $FLAG
