name: Feature request
description: Suggest a new feature or a change to the specification
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Mention the affected module and specification chapter if you know them.
    validations:
      required: true
