name: Bug report
description: Report something that does not work as described in the specification
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Version and build number from the About page or `GET /api/health`
      placeholder: 1.0.0-beta.12
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps to reproduce, the result you expected and the result you got
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove tokens, keys and personal data first.
      render: text
