# git-cliff configuration, see docs/spec/README.md chapter 11.
# CHANGELOG.md is generated in the `chore(release)` commit on dev.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-beta\\.[0-9]+)?$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^init", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  # The release commit on main, `<codename>(vX.Y.Z[-beta.N]): …` (chapter 11).
  { message = "^[a-z]+\\(v[0-9]+\\.[0-9]+\\.[0-9]+(-beta\\.[0-9]+)?\\):", skip = true },
  { body = ".*BREAKING CHANGE.*", group = "<!-- 0 -->Breaking changes" },
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^revert", group = "<!-- 6 -->Reverts" },
  { message = "^(build|ci|test|chore)", group = "<!-- 7 -->Other" },
]
